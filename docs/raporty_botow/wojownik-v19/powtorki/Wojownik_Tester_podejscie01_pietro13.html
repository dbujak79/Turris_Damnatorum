<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Układ: mapa areny z góry (lewa, kwadrat) + panel stanu i dziennik walki (prawa); na telefonie jedna kolumna. */
:root {
  --bg: #f3f1f4; --panel: #ffffff; --ink: #221d26; --muted: #6d6474; --line: #ddd6e0;
  --floor: #ebe7ee; --grid: #d6cfdb; --hero: #1f6fd1; --hurt: #c8322b; --hp: #2f9a5b; --st: #c99a1c; --accent: #8a2f4a;
  --shot-enemy: #e0702a; --shot-hero: #1aa3b8;
  --f-display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16131a; --panel: #1f1b24; --ink: #ece6ef; --muted: #a59bac; --line: #352e3b;
  --floor: #221d28; --grid: #2f2836; --hero: #5aa2ff; --hurt: #ff5d55; --hp: #4cc581; --st: #e6b83c; --accent: #d77394;
  --shot-enemy: #ff9a52; --shot-hero: #4fd4e6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16131a; --panel: #1f1b24; --ink: #ece6ef; --muted: #a59bac; --line: #352e3b;
  --floor: #221d28; --grid: #2f2836; --hero: #5aa2ff; --hurt: #ff5d55; --hp: #4cc581; --st: #e6b83c; --accent: #d77394;
  --shot-enemy: #ff9a52; --shot-hero: #4fd4e6; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 3.2vw, 32px); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.meta b { color: var(--ink); font-weight: 600; }
.verdict { color: var(--hurt); font-weight: 600; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 10px; min-width: 0; }
canvas { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; background: var(--floor); border: 1px solid var(--line); border-radius: 6px; display: block; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { font: 600 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.time { font-family: var(--f-data); font-variant-numeric: tabular-nums; color: var(--muted); margin-left: auto; }
.timeline { position: relative; }
#scrub { width: 100%; accent-color: var(--accent); }
#ticks { position: relative; height: 8px; margin: 0 8px; }
#ticks i { position: absolute; top: 0; width: 2px; height: 8px; border-radius: 1px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 14px; min-width: 0; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bar { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; transition: width .1s linear; }
.barrow { display: grid; gap: 4px; }
.barrow .val { font-family: var(--f-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#log { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; font-size: 13px; display: grid; gap: 2px; }
#log li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
#log li .t { font-family: var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
#log li .v { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
#log li.hurt .v, #log li.death { color: var(--hurt); }
#log li.now { background: var(--grid); }
#log li.future { opacity: .45; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
